
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full CI/CD Pipeline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #0f0f0f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
            padding: 40px;
        }
        h1 { font-size: 3em; color: #00d4ff; margin-bottom: 10px; }
        p  { font-size: 1.2em; color: #aaa; margin-bottom: 30px; }
        .badges { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .badge {
            background: #1e1e1e;
            border: 1px solid #00d4ff;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9em;
            color: #00d4ff;
        }
        .status {
            margin-top: 30px;
            background: #1e1e1e;
            border-left: 4px solid #00ff88;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1em;
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Full CI/CD Pipeline</h1>
        <p>Automated deployment using Jenkins, Docker & DockerHub</p>
        <div class="badges">
            <span class="badge">⚙️ Jenkins</span>
            <span class="badge">🐳 Docker</span>
            <span class="badge">☁️ AWS EC2</span>
            <span class="badge">🐙 GitHub</span>
            <span class="badge">📦 DockerHub</span>
        </div>
        <div class="status">
            ✅ Pipeline Status: Build → Push → Deploy — SUCCESS!
        </div>
    </div>
</body>
</html>
